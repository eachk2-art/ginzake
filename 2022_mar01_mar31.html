<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>石巻魚市場 ギンザケ日計表 2022年3月</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Hiragino Sans','Meiryo',sans-serif; background:#F8FAFB; color:#2C2C2A; }
.page-wrap { max-width: 1100px; margin: 0 auto; padding: 16px 12px 32px; }
.nav-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:8px; flex-wrap:wrap; }
.nav-btn { padding:6px 14px; font-size:13px; border:1px solid #B0C4D8; border-radius:6px; background:#fff; color:#1A3A5C; cursor:pointer; }
.nav-btn:disabled { color:#B0B8C0; cursor:default; }
.nav-btn:not(:disabled):hover { background:#EEF4FB; }
.back-btn { padding:6px 14px; font-size:13px; border:1px solid #B0C4D8; border-radius:6px; background:#fff; color:#1A3A5C; cursor:pointer; }
.back-btn:hover { background:#EEF4FB; }
.chart-header { margin-bottom:6px; }
.chart-title { font-size:14px; font-weight:700; color:#2C2C2A; margin-bottom:8px; }
.legend { display:flex; flex-wrap:wrap; gap:4px 0; font-size:13px; color:#2C2C2A; margin-bottom:8px; align-items:center; }
.mode-row { display:flex; gap:8px; margin-bottom:8px; }
.mode-btn { padding:5px 12px; font-size:12px; border:1px solid #B0C4D8; border-radius:6px; background:#fff; color:#1A3A5C; cursor:pointer; }
.mode-btn.active { background:#1A3A5C; color:#fff; border-color:#1A3A5C; }
.chart-outer { position:relative; width:100%; }
.chart-container { position:relative; height:400px; }
.note { font-size:12px; color:#888; margin-top:8px; }
/* タッチパネル */
#touch-panel { display:none; position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:2px solid #B5D4F4; padding:10px 14px; max-height:30vh; overflow-y:auto; z-index:100; font-size:13px; }
#touch-panel .tp-date { font-weight:700; margin-bottom:4px; color:#1A3A5C; }
#touch-panel .tp-row { display:flex; align-items:center; gap:8px; padding:2px 0; }
#touch-panel .tp-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
#touch-panel .tp-close { position:absolute; top:8px; right:12px; font-size:18px; color:#888; cursor:pointer; line-height:1; }
</style>
</head>
<body>
<div class="page-wrap">
  <div class="nav-row">
    <button class="nav-btn" disabled>← 前の期間</button>
    <button class="back-btn" onclick="location.href='index_2022.html'">一覧に戻る</button>
    <button onclick="location.href='2022_apr01_apr30.html'" class="nav-btn">4月 →</button>
  </div>

  <div class="chart-header">
    <div class="chart-title">石巻魚市場 ギンザケ日計表 2022年3月</div>
    <div class="legend"><span style="display:inline-flex;align-items:center;gap:4px;margin-right:12px;">
      <span style="display:inline-block;width:14px;height:14px;background:#B5D4F4;border:1.5px solid #378ADD;border-radius:2px;"></span>
      <span>合計数量（左軸）</span></span><span style="display:inline-flex;align-items:center;gap:4px;margin-right:12px;">
      <svg width="32" height="14" style="overflow:visible"><line x1="0" y1="7" x2="32" y2="7" stroke="#1D9E75" stroke-width="2.5"/><circle cx="16" cy="7" r="5" fill="#1D9E75"/></svg>
      <span>1.5k上</span></span><span style="display:inline-flex;align-items:center;gap:4px;margin-right:12px;">
      <svg width="32" height="14" style="overflow:visible"><line x1="0" y1="7" x2="32" y2="7" stroke="#D4537E" stroke-width="2.5"/><circle cx="16" cy="7" r="5" fill="#D4537E"/></svg>
      <span>1k上</span></span><span style="display:inline-flex;align-items:center;gap:4px;margin-right:12px;">
      <svg width="32" height="14" style="overflow:visible"><line x1="0" y1="7" x2="32" y2="7" stroke="#534AB7" stroke-width="2.5"/><circle cx="16" cy="7" r="5" fill="#534AB7"/></svg>
      <span>全体平均単価</span></span></div>
    <div class="mode-row">
      <button class="mode-btn active" id="btn-full" onclick="setMode('full')">全体表示</button>
      <button class="mode-btn" id="btn-scroll" onclick="setMode('scroll')">横スクロール</button>
    </div>
  </div>

  <div class="chart-outer" id="chart-outer">
    <div class="chart-container" id="chart-container">
      <canvas id="myChart"></canvas>
    </div>
  </div>
  <div class="note">※ 点線は水揚げのなかった日の補間。スレ・次品・0.5k上は折れ線から除外。　※ 3/1〜3/17はデータなし。</div>
</div>

<div id="touch-panel">
  <span class="tp-close" onclick="document.getElementById('touch-panel').style.display='none'">✕</span>
  <div id="tp-content"></div>
</div>

<script>
const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
const labels = ["3/1", "3/2", "3/3", "3/4", "3/5", "3/6", "3/7", "3/8", "3/9", "3/10", "3/11", "3/12", "3/13", "3/14", "3/15", "3/16", "3/17", "3/18", "3/19", "3/20", "3/21", "3/22", "3/23", "3/24", "3/25", "3/26", "3/27", "3/28", "3/29", "3/30", "3/31"];
const datasets = [{
        type: 'bar',
        label: '合計数量',
        data: [null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, 8.03, 3.61, null, null, 8.19, 5.33, 6.2, 2.7, 6.57, null, 8.04, 4.94, 11.19, 7.21],
        backgroundColor: '#B5D4F4',
        borderColor: '#378ADD',
        borderWidth: 1,
        yAxisID: 'yLeft',
        order: 10
      },
      {
        type: 'line',
        label: '1.5k上',
        data: [null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, 1057, 1073, null, null, 1035, 1007, 984, 950, 960, null, 938, 820, 802, 783],
        borderColor: '#1D9E75',
        backgroundColor: '#1D9E75',
        pointBackgroundColor: '#1D9E75',
        pointRadius: 5,
        pointHoverRadius: 7,
        borderWidth: 2.5,
        yAxisID: 'yRight',
        spanGaps: true,
        segment: {
          borderDash: ctx => {
            const i = ctx.p0DataIndex;
            const hasP0 = [null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, 1057, 1073, null, null, 1035, 1007, 984, 950, 960, null, 938, 820, 802, 783][i] !== null;
            const hasP1 = [null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, 1057, 1073, null, null, 1035, 1007, 984, 950, 960, null, 938, 820, 802, 783][i+1] !== null;
            return (!hasP0 || !hasP1) ? [5,4] : [];
          },
        },
        pointStyle: ctx => [null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, 1057, 1073, null, null, 1035, 1007, 984, 950, 960, null, 938, 820, 802, 783][ctx.dataIndex] !== null ? 'circle' : false,
        order: 1
      },
      {
        type: 'line',
        label: '1k上',
        data: [null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, 1028, 1087, null, null, 1004, 1004, 933, 945, 923, null, 912, 796, 767, 748],
        borderColor: '#D4537E',
        backgroundColor: '#D4537E',
        pointBackgroundColor: '#D4537E',
        pointRadius: 5,
        pointHoverRadius: 7,
        borderWidth: 2.5,
        yAxisID: 'yRight',
        spanGaps: true,
        segment: {
          borderDash: ctx => {
            const i = ctx.p0DataIndex;
            const hasP0 = [null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, 1028, 1087, null, null, 1004, 1004, 933, 945, 923, null, 912, 796, 767, 748][i] !== null;
            const hasP1 = [null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, 1028, 1087, null, null, 1004, 1004, 933, 945, 923, null, 912, 796, 767, 748][i+1] !== null;
            return (!hasP0 || !hasP1) ? [5,4] : [];
          },
        },
        pointStyle: ctx => [null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, 1028, 1087, null, null, 1004, 1004, 933, 945, 923, null, 912, 796, 767, 748][ctx.dataIndex] !== null ? 'circle' : false,
        order: 1
      },
      {
        type: 'line',
        label: '全体平均単価',
        data: [null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, 1023, 1048, null, null, 1005, 1000, 935, 938, 918, null, 914, 790, 767, 744],
        borderColor: '#534AB7',
        backgroundColor: '#534AB7',
        pointBackgroundColor: '#534AB7',
        pointRadius: 5,
        pointHoverRadius: 7,
        borderWidth: 2.5,
        yAxisID: 'yRight',
        spanGaps: true,
        segment: {
          borderDash: ctx => {
            const i = ctx.p0DataIndex;
            const hasP0 = [null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, 1023, 1048, null, null, 1005, 1000, 935, 938, 918, null, 914, 790, 767, 744][i] !== null;
            const hasP1 = [null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, 1023, 1048, null, null, 1005, 1000, 935, 938, 918, null, 914, 790, 767, 744][i+1] !== null;
            return (!hasP0 || !hasP1) ? [5,4] : [];
          },
        },
        pointStyle: ctx => [null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, 1023, 1048, null, null, 1005, 1000, 935, 938, 918, null, 914, 790, 767, 744][ctx.dataIndex] !== null ? 'circle' : false,
        order: 1
      }];

const COLORS = {"\u5168\u4f53\u5e73\u5747\u5358\u4fa1": "#534AB7", "3.5k\u4e0a": "#2E86AB", "3k\u4e0a": "#7B3FA0", "2.5k\u4e0a": "#E8A020", "2k\u4e0a": "#D85A30", "1.5k\u4e0a": "#1D9E75", "1k\u4e0a": "#D4537E"};

const ctx = document.getElementById('myChart').getContext('2d');
const chart = new Chart(ctx, {
  data: { labels, datasets },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: { display: false },
      tooltip: {
        enabled: !isTouch,
        
        callbacks: {
          label: function(ctx) {
            if (ctx.parsed.y === null) return null;
            if (ctx.dataset.type === 'bar') {
              return '合計数量: ' + ctx.parsed.y.toFixed(1) + 't';
            }
            return ctx.dataset.label + ': ' + ctx.parsed.y.toLocaleString() + '円/kg';
          }
        }
      }
    },
    scales: {
      x: {
        ticks: {
          autoSkip: false,
          maxRotation: 45,
          minRotation: 45,
          font: { size: 13, weight: '500' },
          color: '#2C2C2A'
        },
        grid: { color: '#E8EEF4' }
      },
      yLeft: {
        type: 'linear',
        position: 'left',
        min: 0,
        max: 30,
        title: { display: true, text: '合計数量（トン）', font: { size: 13, weight: '500' }, color: '#2C2C2A' },
        ticks: {
          font: { size: 13 },
          color: '#2C2C2A',
          callback: v => v + 't'
        },
        grid: { color: '#E8EEF4' }
      },
      yRight: {
        type: 'linear',
        position: 'right',
        min: 700,
        max: 1200,
        title: { display: true, text: '平均単価（円/kg）', font: { size: 13, weight: '500' }, color: '#2C2C2A' },
        ticks: {
          font: { size: 13 },
          color: '#2C2C2A',
          callback: v => v.toLocaleString() + '円'
        },
        grid: { drawOnChartArea: false }
      }
    }
  }
});

// タッチパネル
if (isTouch) {
  document.getElementById('myChart').addEventListener('click', function(e) {
    const points = chart.getElementsAtEventForMode(e, 'index', { intersect: false }, true);
    if (!points.length) return;
    const idx = points[0].index;
    const date = labels[idx];
    let html = '<div class="tp-date">' + date + '</div>';
    datasets.forEach(ds => {
      const val = ds.data[idx];
      if (val === null || val === undefined) return;
      const color = ds.borderColor || '#888';
      if (ds.type === 'bar') {
        html += '<div class="tp-row"><span class="tp-dot" style="background:#B5D4F4;border:1px solid #378ADD;border-radius:2px;"></span><span>合計数量: ' + val.toFixed(1) + 't</span></div>';
      } else {
        html += '<div class="tp-row"><span class="tp-dot" style="background:' + color + '"></span><span>' + ds.label + ': ' + val.toLocaleString() + '円/kg</span></div>';
      }
    });
    document.getElementById('tp-content').innerHTML = html;
    document.getElementById('touch-panel').style.display = 'block';
  });
}

// 表示モード切替
function setMode(mode) {
  const outer = document.getElementById('chart-outer');
  const container = document.getElementById('chart-container');
  document.getElementById('btn-full').classList.toggle('active', mode === 'full');
  document.getElementById('btn-scroll').classList.toggle('active', mode === 'scroll');
  if (mode === 'scroll') {
    const w = Math.max(labels.length * 28, 600);
    outer.style.overflowX = 'auto';
    container.style.width = w + 'px';
  } else {
    outer.style.overflowX = '';
    container.style.width = '';
  }
  chart.resize();
}
</script>
</body>
</html>
